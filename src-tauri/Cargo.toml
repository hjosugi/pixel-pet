[package]
name = "pixel-pet"
version = "0.2.4"
description = "A lightweight cyberpunk pixel desktop pet."
authors = ["pixel-pet contributors"]
license = "0BSD"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-process = "~2.4.0"
tauri-plugin-updater = { version = "~2.14.0", default-features = false, features = ["rustls-tls"] }

[patch.crates-io]
# GTK3 requires this release line; retain the reviewed upstream soundness fix.
glib = { path = "vendor/glib-0.18.5-patched" }
