name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Check Tauri runtime package versions
        run: npm run check:tauri-versions

      - name: Check generated assets
        run: npm run assets:check

      - name: Build frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Check Tauri Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  native-platforms:
    name: Native compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:tauri-versions
      - run: npm run assets:check
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
